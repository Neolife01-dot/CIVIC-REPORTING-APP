<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reports | Civic Reporting App</title>

    <link rel="stylesheet" href="../css/reports.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>My Reports</h1>

    <p>Track every issue you have reported.</p>

    <table>

        <thead>

            <tr>

                <th>Issue</th>

                <th>Category</th>

                <th>Date</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            <tr>

                <td>Pothole on Aba Road</td>

                <td>Road</td>

                <td>04 Aug 2026</td>

                <td><span class="pending">Pending</span></td>

                <td><button>View</button></td>

            </tr>

            <tr>

                <td>Blocked Drainage</td>

                <td>Flooding</td>

                <td>01 Aug 2026</td>

                <td><span class="review">Under Review</span></td>

                <td><button>View</button></td>

            </tr>

            <tr>

                <td>Broken Streetlight</td>

                <td>Streetlight</td>

                <td>28 Jul 2026</td>

                <td><span class="resolved">Resolved</span></td>

                <td><button>View</button></td>

            </tr>

        </tbody>

    </table>

</div>

<script src="../js/reports.js"></script>

</body>
</html>
